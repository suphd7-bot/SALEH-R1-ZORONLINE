<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mute:#6b7685;--line:#e3e8ef;--brand:#1f4e78;--brand2:#2f6fa8;--ok:#2e7d32;--okbg:#e6f4e7;--warn:#b26a00;--warnbg:#fff1d6;--bad:#c62828;--badbg:#fde7e7;--idle:#eef1f5;--chip:#eaf1f8;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#18202b;--ink:#e8edf3;--mute:#93a0b1;--line:#27313e;--brand:#6aa9e0;--brand2:#8fc0ee;--ok:#6fcf74;--okbg:#17301a;--warn:#f0b04a;--warnbg:#3a2c10;--bad:#ff7b7b;--badbg:#3a1717;--idle:#222b37;--chip:#1f2b3a;}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202b;--ink:#e8edf3;--mute:#93a0b1;--line:#27313e;--brand:#6aa9e0;--brand2:#8fc0ee;--ok:#6fcf74;--okbg:#17301a;--warn:#f0b04a;--warnbg:#3a2c10;--bad:#ff7b7b;--badbg:#3a1717;--idle:#222b37;--chip:#1f2b3a;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff;padding:12px 16px}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
main{padding:12px 12px 8px;max-width:640px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.h2{font-size:14px;font-weight:700;color:var(--mute);margin:14px 4px 8px;letter-spacing:.2px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--brand)}
.kpi span{font-size:11.5px;color:var(--mute)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-idle{background:var(--idle);color:var(--mute)}
.scroll{overflow-x:auto}.scroll .tbl{min-width:560px}.scroll .tbl td,.scroll .tbl th{white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--chip);color:var(--brand);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;direction:ltr;display:inline-block}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);text-align:center;cursor:pointer}
.day small{display:block;color:var(--mute);font-size:11px}
.day.on{background:var(--brand);color:#fff;border-color:var(--brand)}.day.on small{color:#fff;opacity:.85}
.day.today{box-shadow:0 0 0 2px var(--ok) inset}
.visit{display:flex;gap:10px;align-items:flex-start}
.visit .tick{flex:0 0 44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:transparent;font-size:24px;cursor:pointer}
.visit.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.visit.done .nm{color:var(--mute);text-decoration:line-through}
.visit .nm{font-weight:700}
.meta{font-size:12.5px;color:var(--mute)}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--idle);color:var(--mute)}.badge.A{background:var(--warnbg);color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .l{flex:1;min-width:0}.row .l b{display:block;font-size:14.5px;direction:ltr;text-align:right}
.bar{height:7px;background:var(--idle);border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--brand2);border-radius:9px}
.step{display:flex;align-items:center;gap:6px;direction:ltr}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.step input{width:60px;height:38px;text-align:center;font:inherit;font-size:17px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:inherit;background:var(--card);color:var(--ink);margin-bottom:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;padding:13px;cursor:pointer;margin-top:8px}
.rep{white-space:pre-wrap;font-size:15px;line-height:1.7}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none}.toast.on{opacity:.92}
.note{font-size:12px;color:var(--mute);padding:4px 6px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}.tbl th{color:var(--mute);font-weight:600;font-size:11.5px}.tbl td:first-child,.tbl th:first-child{text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;margin:1px 2px;background:var(--idle);color:var(--mute)}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}
textarea,select.sel,input.tx{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);margin:4px 0 8px}
textarea{min-height:58px;resize:vertical}
.lab{font-size:12px;color:var(--mute);font-weight:600;margin-top:6px}
.menu{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}.menu .ic{font-size:24px}.menu b{display:block}.menu span.m{font-size:12px;color:var(--mute)}
.ins{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}.ins:last-child{border:0}.ins i{font-style:normal;flex:0 0 22px}
.kpi b,.up,.dn{unicode-bidi:isolate;direction:ltr;display:inline-block}.kpi b{display:block}
.big{font-size:26px;font-weight:800;color:var(--brand)}
.tabs button{font-size:10.5px}.tabs button .ic{font-size:19px}

/* ===== v6 design ===== */
header{background:linear-gradient(135deg,#123a63 0%,#1f5f99 100%);box-shadow:0 2px 10px rgba(10,30,60,.18)}
.hd{display:flex;align-items:center;gap:12px;max-width:1320px;margin:0 auto}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:21px}
.ht{flex:1;min-width:0}.ht h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hstat .pill{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.card{box-shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.04);border-radius:16px}
.kpi{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.kpi:before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.h2{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14.5px;margin:18px 4px 9px}
.h2:before{content:"";width:4px;height:15px;border-radius:3px;background:var(--brand2)}
.tbl tr:hover td{background:var(--chip)}
.tbl td,.tbl th{padding:8px 5px}
.btn{border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.12)}
#side{display:none}
.sdb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--line)}
.sdb-brand .logo{background:linear-gradient(135deg,#123a63,#2f6fa8);color:#fff}
.sdb-brand b{display:block;font-size:15px}.sdb-brand span{font-size:11.5px;color:var(--mute)}
.sdb-grp{font-size:11px;color:var(--mute);font-weight:700;padding:14px 18px 6px;letter-spacing:.3px}
.sdb-it{display:flex;align-items:center;gap:11px;width:calc(100% - 16px);margin:2px 8px;padding:10px 12px;border:0;border-radius:11px;background:none;color:var(--ink);font:inherit;font-size:14.5px;text-align:right;cursor:pointer}
.sdb-it:hover{background:var(--chip)}.sdb-it.on{background:var(--brand);color:#fff;font-weight:700}.sdb-it .ic{font-size:18px;width:22px;text-align:center}
.sdb-ft{margin-top:auto;padding:14px 16px;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line)}
@media (min-width:1000px){
  body{padding-bottom:28px;padding-right:252px;font-size:15.5px}
  #tabs{display:none}
  #side{display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;width:252px;background:var(--card);border-left:1px solid var(--line);z-index:7;overflow-y:auto}
  header{padding:14px 28px}.ht h1{font-size:21px}
  main{max-width:1400px;margin:0 auto;padding:20px 28px 10px;column-count:2;column-gap:20px}
  main>*{break-inside:avoid}
  main>.h2.span,main>.card.span,main>.card.scroll,main>.kpis,main>.days,main>.chips,main>button.day,main>.banner{column-span:all}
  .h2{break-after:avoid;font-size:15.5px}
  .kpi b{font-size:26px}.kpi span{font-size:12.5px}.tbl{font-size:14px}
  .card{padding:15px 18px}
  .toast{top:76px}
}
@media (min-width:1700px){main{column-count:3}}
@media print{#side,#tabs,.toast,.noprint{display:none!important}body{padding:0;background:#fff}header{position:static}main{column-count:1!important;max-width:none}}

function calc(){
  const items=DATA.items.map((it,i)=>{let a=0;for(const d of DAYS){a+=Number((state.log[d]||{})[i]||0);}return {...it,i,target:it.t[MI()],actual:a};});
  const dData=DAYS.filter(d=>Object.values(state.log[d]||{}).some(v=>Number(v)>0)).length;
  const target=items.reduce((s,x)=>s+x.target,0), actual=items.reduce((s,x)=>s+x.actual,0);
  items.forEach(x=>{x.proj=(dData>0&&x.target>0)?x.actual/dData*NDAYS/x.target:null;
    x.st=(x.cover!=null&&x.cover<1)?'low':(x.proj==null?'idle':(x.proj<0.85?'behind':'ok'));});
  const proj=dData>0?actual/dData*NDAYS/target:null;
  const need=(NDAYS-dData)>0?Math.max(target-actual,0)/(NDAYS-dData):null;
  const mv=DATA.vis.filter(v=>v.d.startsWith(curM));const vDone=mv.filter(v=>state.done[v.d+'|'+v.k]).length;const vTot=mv.length;
  const docs=DATA.docs.map(d=>{const key=d.h+'|'+d.n;const pl=DATA.vis.filter(v=>v.k===key);const seen=pl.filter(v=>state.done[v.d+'|'+v.k]).length;return {...d,key,total:d.m.reduce((a,b)=>a+b,0),planned:pl.length,seen};});
  const sorted=[...docs].sort((a,b)=>b.total-a.total);sorted.forEach((d,i)=>d.tier=i<10?'Key':i<25?'Core':'Maintain');
  return {items,dData,target,actual,proj,need,vDone,vTot,docs,sorted};
}

  // visit plan
  const vl=DATA.vis.filter(v=>v.k.startsWith('HAB|')).sort((a,b)=>a.d.localeCompare(b.d));
  h+='<div class="h2">خطة زيارات الحبيب (الأحد–الأربعاء)</div><div class="card">'+(vl.length?vl.map(v=>{const d=D.find(x=>x.key===v.k);const dn=state.done[v.d+'|'+v.k];const l=dayLabel(v.d);return `<div class="row"><button class="tick day ${dn?'on':''}" data-v="${v.d}|${esc(v.k)}" style="flex:0 0 38px;height:38px">${dn?'✓':''}</button><div class="l"><b style="text-align:right">${d?esc(d.n):esc(v.k)}</b><span class="meta">${l.n} ${l.d} · ${d?esc(d.h)+' · '+esc(d.sp)+' · Class '+d.c:''}</span></div></div>`;}).join(''):'لا زيارات مخططة.')+'</div>';
  return h;}
function vHabDoc(d,D){
  let h='<button class="day" data-hdsel="">‹ كل الدكاترة</button>';
  h+=`<div class="card" style="margin-top:8px"><b style="font-size:17px">${esc(d.n)}</b><div class="chips"><span class="tag">${esc(d.h)}</span><span class="tag">${esc(d.sp)}</span><span class="badge ${d.c}">Class ${d.c}</span><span class="tag">${esc(d.prio)}</span><span class="tag">${esc(d.st)}</span><span class="tag">${d.tier}</span></div>
  <div class="kpis" style="margin-top:8px"><div class="kpi"><b>${d.act}/${d.goal}</b><span>زيارات HQ</span></div><div class="kpi"><b>${d.rem}</b><span>متبقي</span></div><div class="kpi"><b>${Mn(d.v)}</b><span>قيمة Q4 (تقدير)</span></div></div>
  <div class="meta">أيام الزيارة المخططة: ${esc(d.days||'—')} · الفرع: ${esc(d.hf)}</div></div>`;
  h+='<div class="h2">التوزيع المتوقع Oct–Dec (وحدات)</div><div class="card"><table class="tbl"><tr><th>الدواء</th><th>الإجمالي</th><th>شهرياً</th><th>القيمة</th></tr>'+HDOC.items.map((it,i)=>d.u[i]?`<tr><td>${esc(it)}</td><td>${fmt(d.u[i])}</td><td>${(d.u[i]/3).toFixed(1)}</td><td>${Mn(d.u[i]*HDOC.price[i])}</td></tr>`:'').join('')+`<tr><td><b>الإجمالي</b></td><td></td><td></td><td><b>${Mn(d.v)}</b></td></tr></table><div class="note">الحقن بالأمبول. التوزيع تقديري حسب تخصص الدكتور وClass (A = ضعف B).</div></div>`;
  const vl=DATA.vis.filter(v=>v.k===d.key);
  h+='<div class="h2">زياراته المخططة</div><div class="card">'+(vl.length?vl.map(v=>{const l=dayLabel(v.d);const dn=state.done[v.d+'|'+v.k];return `<div class="row"><button class="tick day ${dn?'on':''}" data-v="${v.d}|${esc(v.k)}" style="flex:0 0 38px;height:38px">${dn?'✓':''}</button><div class="l"><b style="text-align:right">${l.n} ${l.d}</b></div></div>`;}).join(''):'<div class="note">لا زيارة هذا الأسبوع.</div>')+'</div>';
  h+='<div class="card">'+noteBox('hd:'+d.n,'ملاحظاتك على الدكتور','ماذا يصف؟ اعتراضاته؟ الموعد القادم؟')+'</div>';
  return h;}

function render(){
  const C=calc();document.getElementById('sub').textContent=`اليوم ${dayLabel(TK).n} ${dayLabel(TK).d} · ${MONTHS.find(x=>x.k===curM).n}: ${C.dData} من ${NDAYS} أيام مسجّلة`;
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="${(t[0]===tab||(t[0]==='more'&&SUBS.includes(tab)))?'on':''}" data-t="${t[0]}"><span class="ic">${t[2]}</span>${t[1]}</button>`).join('');
  const app=document.getElementById('app');const keep=window.scrollY;
  {const Tt=sCalc();const lbl={ok:'أخضر',warn:'أصفر',bad:'أحمر'}[Tt.st];const Pc0=planCalc();document.getElementById('hstat').innerHTML=`<span class="pill p-${Tt.st}">${lbl} · ${Math.round(Pc0.o*100)}%</span>`;
  const itm=(id,lbl,ic,attr)=>`<button class="sdb-it ${(attr==='acc'?(tab==='acc'&&accSel==='DALLAH'):(id===tab&&!(tab==='acc'&&accSel==='DALLAH')))?'on':''}" ${attr==='acc'?'data-acc="DALLAH"':'data-t="'+id+'"'}><span class="ic">${ic}</span>${lbl}</button>`;
  const G=(l,a)=>`<div class="sdb-grp">${l}</div>`+a.map(x=>itm(x[0],x[1],x[2],x[3])).join('');
  document.getElementById('side').innerHTML=`<div class="sdb-brand"><div class="logo">📊</div><div><b>منصة المبيعات</b><span>GIT 2 · الرياض</span></div></div>`
   +G('التحليل',[['home','نظرة عامة','🏠'],['plan','خطة التحقيق','🎯'],['explore','المستكشف','🔎'],['lines','الخطوط','📚']])
   +G('الحسابات',[['acc','كل الحسابات','🏢'],['dal','دله 360','🏥','acc'],['habib','الحبيب 360','🏨'],['hdocs','دكاترة الحبيب','🩺']])
   +G('التشغيل اليومي',[['today','اليوم','☑️'],['dash','المبيعات بالعلب','📦'],['docs','الدكاترة','👨‍⚕️']])
   +G('المرجع',[['catalog','الكتالوج والتصنيف','🗂️'],['year','السنة','📅'],['team','الفريق والفوركاست','👥'],['comp','المنافسة','⚔️']])
   +G('التقارير',[['rep','تقرير المدير','📝'],['setup','المصادر والإعداد','⚙️']])
   +`<div class="sdb-ft">${esc(ASOF)}</div>`;}
  const bn=readOnly?`<div class="card banner" style="background:var(--warnbg)">نسخة للعرض فقط · بيانات بتاريخ ${shareDate}<button class="btn" id="adopt" style="margin-top:8px">استخدم هذه البيانات عندي</button></div>`:'';const back=SUBS.includes(tab)?'<button class="day" data-t="more" style="margin-bottom:8px">‹ المزيد</button>':'';app.innerHTML=bn+back+({home:vHome,plan:vPlan,lines:vLines,explore:vExplore,habib:vHabib,hdocs:vHabDocs,catalog:vCatalog,more:vMore,team:vTeam,acc:vAcc,comp:vComp,setup:vSetup,today:vDay,dash:vDash,year:vYear,docs:vDocs,rep:vRep}[tab])(C);
  document.querySelectorAll('#app>.h2').forEach(h=>{const n=h.nextElementSibling;if(n&&(n.matches('.span,.scroll,.chips,.kpis,.days')))h.classList.add('span');});
  bind();window.scrollTo(0,keep);}

function bind(){
  document.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{setMonth(b.dataset.mon);render();});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selDay=b.dataset.day;render();});
  document.querySelectorAll('[data-lday]').forEach(b=>b.onclick=()=>{logDay=b.dataset.lday;render();});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(readOnly){toast('نسخة للعرض فقط');return;}const k=b.dataset.v;if(state.done[k])delete state.done[k];else state.done[k]=1;save();render();});
  const setV=(i,v)=>{if(readOnly){toast('نسخة للعرض فقط');return;}state.log[logDay]=state.log[logDay]||{};if(v===''||v==null||isNaN(v)||v<=0)delete state.log[logDay][i];else state.log[logDay][i]=Math.round(v*10)/10;save();};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=b.dataset.p;setV(i,Number((state.log[logDay]||{})[i]||0)+1);render();});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=b.dataset.m;setV(i,Math.max(0,Number((state.log[logDay]||{})[i]||0)-1));render();});
  document.querySelectorAll('[data-in]').forEach(inp=>inp.onchange=()=>{setV(inp.dataset.in,inp.value===''?'':Number(inp.value));render();});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{docFilter=b.dataset.f;render();});
  const q=document.getElementById('q');if(q)q.oninput=()=>{docQ=q.value;const p=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};

  document.querySelectorAll('[data-t]').forEach(b=>{if(b.closest('#tabs'))return;b.onclick=()=>{tab=b.dataset.t;if(tab==='acc')accSel=null;if(tab==='lines')lineSel=null;if(tab==='habib')habSel=null;if(tab==='hdocs')hdSel=null;render();window.scrollTo(0,0);};});
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();accSel=b.dataset.acc||null;if(tab!=='acc'){tab='acc';}render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{dayMode=b.dataset.dm;render();});
  document.querySelectorAll('[data-real]').forEach(b=>b.onclick=()=>{real=Number(b.dataset.real);render();});
  document.querySelectorAll('[data-line]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();lineSel=b.dataset.line||null;if(tab!=='lines')tab='lines';render();window.scrollTo(0,0);});

  document.querySelectorAll('[data-hl]').forEach(b=>b.onclick=()=>{habLine=b.dataset.hl;habSel=null;if(tab!=='habib')tab='habib';render();});
  document.querySelectorAll('[data-hp]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();habSel=b.dataset.hp||null;tab='habib';render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-xd]').forEach(b=>b.onclick=()=>{exp.dim=b.dataset.xd;exp.q='';render();});
  document.querySelectorAll('[data-xr]').forEach(b=>b.onclick=()=>{if(b.dataset.xr==='*')exp.f={};else delete exp.f[b.dataset.xr];render();});
  document.querySelectorAll('[data-xv]').forEach(b=>b.onclick=()=>{exp.f[exp.dim]=b.dataset.xv;const nx={line:'brand',brand:'prod',prod:'cust',rep:'prod',cust:'prod',sub:'cust',st:'prod'};const used=Object.keys(exp.f);let n=nx[exp.dim];if(used.includes(n))n=DIMS.map(d=>d[0]).find(d=>!used.includes(d))||exp.dim;exp.dim=n;exp.q='';render();window.scrollTo(0,0);});
  const xq=document.getElementById('xq');if(xq)xq.oninput=()=>{exp.q=xq.value;const p=xq.selectionStart;render();const n=document.getElementById('xq');n.focus();n.setSelectionRange(p,p);};
  const cq=document.getElementById('cq');if(cq)cq.oninput=()=>{catQ=cq.value;const p=cq.selectionStart;render();const n=document.getElementById('cq');n.focus();n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{catLine=b.dataset.cl;render();});
  const xc=document.getElementById('xcopy');if(xc)xc.onclick=async()=>{const {list}=expData();const dn=DIMS.find(d=>d[0]===exp.dim)[1];const tsv=[[dn,'YTD2026','YTD2025','Q4_2025','Target_YTD'].join('\t'),...list.map(o=>[o.n,o.y26,o.y25,o.q4,o.bY].join('\t'))].join('\n');try{await navigator.clipboard.writeText(tsv);toast('تم النسخ ✓');}catch(e){prompt('انسخ',tsv);}};

  document.querySelectorAll('[data-hdb]').forEach(b=>b.onclick=()=>{hdF.br=b.dataset.hdb;hdSel=null;tab='hdocs';render();});
  document.querySelectorAll('[data-hdc]').forEach(b=>b.onclick=()=>{hdF.cls=b.dataset.hdc;render();});
  document.querySelectorAll('[data-hds]').forEach(b=>b.onclick=()=>{hdF.st=b.dataset.hds;render();});
  document.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>{hdSel=b.dataset.hd;render();window.scrollTo(0,0);});
  document.querySelectorAll('[data-hdsel]').forEach(b=>b.onclick=()=>{hdSel=null;render();});
  const hq=document.getElementById('hq');if(hq)hq.oninput=()=>{hdF.q=hq.value;const p=hq.selectionStart;render();const n=document.getElementById('hq');n.focus();n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-af]').forEach(b=>b.onclick=()=>{accF=b.dataset.af;render();});
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>{teamSel=b.dataset.rep;render();});
  document.querySelectorAll('[data-note]').forEach(n=>n.onchange=()=>{if(readOnly){toast('نسخة للعرض فقط');return;}state.notes[n.dataset.note]=n.value;save();});
  const bke=document.getElementById('bkexp');if(bke)bke.onclick=()=>{document.getElementById('bk').value=JSON.stringify(state);toast('تم التصدير ✓');};
  const bki=document.getElementById('bkimp');if(bki)bki.onclick=()=>{try{const o=JSON.parse(document.getElementById('bk').value);if(o&&o.done&&o.log){state={done:o.done,log:o.log,notes:o.notes||{}};save();render();toast('تم الاستيراد ✓');}else toast('نص غير صالح');}catch(e){toast('نص غير صالح');}};
  const ad=document.getElementById('adopt');if(ad)ad.onclick=()=>{readOnly=false;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}save();initDb();render();};
  const pr=document.getElementById('prt');if(pr)pr.onclick=()=>window.print();
  const sh=document.getElementById('share');if(sh)sh.onclick=async()=>{const url=location.href.split('#')[0]+'#s='+encState();try{if(navigator.share){await navigator.share({title:'داشبورد دله',url:url});return;}}catch(e){}try{await navigator.clipboard.writeText(url);toast('تم نسخ الرابط ✓');}catch(e){prompt('انسخ الرابط',url);}};
  const cp=document.getElementById('copy');if(cp)cp.onclick=async()=>{const t=document.getElementById('reptxt').innerText;try{await navigator.clipboard.writeText(t);toast('تم النسخ ✓');}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('reptxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('حدد النص وانسخه');}};
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;if(tab==='acc')accSel=null;if(tab==='lines')lineSel=null;if(tab==='habib')habSel=null;render();window.scrollTo(0,0);}});
load();{const m=location.hash.match(/[#&]s=([^&]+)/);if(m){try{const r=decState(m[1]);state=r.st;readOnly=true;shareDate=r.t;}catch(e){}}}render();initDb();
</script>
</body>
