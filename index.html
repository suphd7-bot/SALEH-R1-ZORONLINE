html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff;padding:12px 16px}
header h1{margin:0;font-size:18px;font-weight:700}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
main{padding:12px 12px 8px;max-width:640px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.h2{font-size:14px;font-weight:700;color:var(--mute);margin:14px 4px 8px;letter-spacing:.2px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:22px;color:var(--brand)}
.kpi span{font-size:11.5px;color:var(--mute)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-idle{background:var(--idle);color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{background:var(--chip);color:var(--brand);border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:600;direction:ltr;display:inline-block}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);text-align:center;cursor:pointer}
.day small{display:block;color:var(--mute);font-size:11px}
.day.on{background:var(--brand);color:#fff;border-color:var(--brand)}.day.on small{color:#fff;opacity:.85}
.day.today{box-shadow:0 0 0 2px var(--ok) inset}
.visit{display:flex;gap:10px;align-items:flex-start}
.visit .tick{flex:0 0 44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:transparent;font-size:24px;cursor:pointer}
.visit.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.visit.done .nm{color:var(--mute);text-decoration:line-through}
.visit .nm{font-weight:700}
.meta{font-size:12.5px;color:var(--mute)}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--idle);color:var(--mute)}.badge.A{background:var(--warnbg);color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .l{flex:1;min-width:0}.row .l b{display:block;font-size:14.5px;direction:ltr;text-align:right}
.bar{height:7px;background:var(--idle);border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--brand2);border-radius:9px}
.step{display:flex;align-items:center;gap:6px;direction:ltr}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.step input{width:60px;height:38px;text-align:center;font:inherit;font-size:17px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input.search{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:inherit;background:var(--card);color:var(--ink);margin-bottom:8px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:700;padding:13px;cursor:pointer;margin-top:8px}
.rep{white-space:pre-wrap;font-size:15px;line-height:1.7}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none}.toast.on{opacity:.92}
.note{font-size:12px;color:var(--mute);padding:4px 6px}
</style>

    else if(tgt[i]!=null){s+=`<rect x="${x}" y="${y(tgt[i])}" width="${w}" height="${H-pb-y(tgt[i])}" rx="3" fill="var(--brand2)" opacity=".35"/>`;
      if(live&&live[i-9]>0)s+=`<rect x="${x}" y="${y(live[i-9])}" width="${w}" height="${H-pb-y(live[i-9])}" rx="3" fill="var(--ok)"/>`;}
    if(a25[i]!=null)s+=`<line x1="${x-1}" x2="${x+w+1}" y1="${y(a25[i])}" y2="${y(a25[i])}" stroke="var(--warn)" stroke-width="2.5"/>`;
    s+=`<text x="${pl+i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="var(--mute)">${MS[i]}</text>`;}
  return s+'</svg>';}
function vYear(C){
  const A=annualCalc(C);
  let h=`<div class="kpis"><div class="kpi"><b>${fmt(A.allYtd)}</b><span>مبيعات يناير–سبتمبر</span></div><div class="kpi"><b>${A.yoy>=0?'+':''}${Math.round(A.yoy*100)}%</b><span>مقابل 2025 (يناير–يوليو)</span></div><div class="kpi"><b>${fmt(A.lineYear)}</b><span>المتوقع للسنة · خط Zoron</span></div></div>`;
  h+='<div class="h2">كل منتجاتي · وحدات شهرياً</div><div class="card">'+svgBars(A.all26,Array(12).fill(null),null,A.all25)+'<div class="note">الأعمدة = 2026 · الخط البرتقالي = 2025 (متوفر يناير–يوليو)</div></div>';
  h+='<div class="h2">خط Zoron · Maxim · Meva (علب)</div><div class="card">'+svgBars(A.lineM,A.lineT,A.liveM,Array(12).fill(null))+'<div class="note">أزرق = فعلي · أزرق فاتح = هدف أكتوبر–ديسمبر · أخضر = المسجّل حتى الآن</div></div>';
  h+='<div class="card">'+A.lineItems.map(x=>`<div class="row"><div class="l"><b>${esc(x.k)}</b><span class="meta">فعلي يناير–سبتمبر ${fmt(x.ytd)} + هدف Q4 ${fmt(x.q4)}</span></div><b>${fmt(x.ytd+x.q4)}</b></div>`).join('')+`<div class="row"><div class="l"><b>الإجمالي المتوقع للسنة</b></div><b>${fmt(A.lineYear)}</b></div></div>`;
  const up=[...A.movers].sort((a,b)=>b.d-a.d).slice(0,5),dn=[...A.movers].sort((a,b)=>a.d-b.d).slice(0,5);
  const mv=a=>a.map(x=>`<div class="row"><div class="l"><b>${esc(x.n.length>34?x.n.slice(0,32)+'…':x.n)}</b><span class="meta">${fmt(x.a)} مقابل ${fmt(x.b)}</span></div><b style="direction:ltr;color:var(--${x.d>=0?'ok':'bad'})">${x.d>=0?'+':''}${fmt(x.d)}</b></div>`).join('');
  h+='<div class="h2">أعلى نمو (يناير–يوليو مقابل 2025)</div><div class="card">'+mv(up)+'</div><div class="h2">أعلى تراجع</div><div class="card">'+mv(dn)+'</div>';
  h+=`<div class="card note"><b>المصدر:</b> ${ASOF}.<br>الرابط ثابت للسنة كلها، ويتحدث بنفس العنوان عند كل تحديث للبيانات.<br>ديسمبر: فوركاست الملف أقل من الشهرين الآخرين (${fmt(A.lineT[11])} علبة).</div>`;
  return h;}

function status(C){const alerts=C.items.filter(x=>x.st==='low').length;
  if(C.dData===0)return {c:'warn',t:'أصفر',s:'جاهزة للبدء'};
  if(C.proj<0.7)return {c:'bad',t:'أحمر',s:'متأخر عن الهدف'};
  if(C.proj>=0.95&&alerts<=1)return {c:'ok',t:'أخضر',s:'على المسار'};
  return {c:'warn',t:'أصفر',s:'معرّض للخطر'};}
function vDash(C){
  const S=status(C);const alerts=C.items.filter(x=>x.st==='low').length, behind=C.items.filter(x=>x.st==='behind').length;
  let h=monthChips()+`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>الحالة العامة · ${MONTHS.find(x=>x.k===curM).n}</span><span class="pill p-${S.c}">${S.t} · ${S.s}</span></div>`;
  h+=`<div class="kpis"><div class="kpi"><b>${fmt(C.target)}</b><span>هدف الشهر</span></div><div class="kpi"><b>${fmt(C.actual)}</b><span>الفعلي</span></div><div class="kpi"><b>${C.target?Math.round(C.actual/C.target*100):0}%</b><span>الإنجاز</span></div>
  <div class="kpi"><b>${C.proj==null?'—':Math.round(C.proj*100)+'%'}</b><span>التوقع للشهر</span></div><div class="kpi"><b>${C.need==null?'—':fmt(C.need)}</b><span>مطلوب/يوم</span></div><div class="kpi"><b>${C.vTot?C.vDone+'/'+C.vTot:'—'}</b><span>الزيارات</span></div>
  <div class="kpi"><b>${alerts}</b><span>مخزون منخفض</span></div><div class="kpi"><b>${behind}</b><span>أصناف متأخرة</span></div><div class="kpi"><b>${C.dData}/${NDAYS}</b><span>أيام مسجّلة</span></div></div>`;
  h+='<div class="h2">حسب المكان</div><div class="card">'+['Nakheel','Namar','Pharmacies'].map(p=>{const it=C.items.filter(x=>x.place===p);const t=it.reduce((a,x)=>a+x.target,0),a=it.reduce((s,x)=>s+x.actual,0);return `<div class="row"><div class="l"><b style="text-align:right">${p==='Nakheel'?'النخيل':p==='Namar'?'نمار':'الصيدليات'}</b><div class="bar"><i style="width:${Math.min(100,t?a/t*100:0)}%"></i></div></div><div style="text-align:left;direction:ltr"><b>${fmt(a)}</b> / ${fmt(t)}</div></div>`;}).join('')+'</div>';
  h+='<div class="h2">الأصناف (الأكبر هدفاً أولاً)</div><div class="card">'+C.items.map(x=>`<div class="row"><div class="l"><b>${esc(x.place)} · ${esc(x.item)}</b><span class="meta">مخزون (30/9) يكفي ${x.cover==null?'—':x.cover+' شهر'}</span><div class="bar"><i style="width:${Math.min(100,x.target?x.actual/x.target*100:0)}%"></i></div></div><div style="text-align:left;direction:ltr;min-width:78px"><b>${fmt(x.actual)}</b> / ${fmt(x.target)}<div>${stPill(x.st)}</div></div></div>`).join('')+'</div>';
  h+='<div class="h2">أعلى 8 دكاترة (علب شهرياً)</div><div class="card">'+C.sorted.slice(0,8).map(d=>`<div class="row"><div class="l"><b style="text-align:right"><bdi>${esc(d.n)}</bdi></b><span class="meta">${d.h==='Nakheel'?'النخيل':'نمار'} · ${esc(d.s)} · زيارات ${d.seen}/${d.planned}</span></div><b>${d.total}</b></div>`).join('')+'</div>';
  return h;}
function vDocs(C){
  const f=[['all','الكل'],['Key','Key'],['A','Class A'],['unseen','لم يُزر']];
  let h=`<input class="search" id="q" placeholder="بحث باسم الدكتور" value="${esc(docQ)}"><div class="chips">`+f.map(x=>`<button class="day ${docFilter===x[0]?'on':''}" data-f="${x[0]}">${x[1]}</button>`).join('')+'</div>';
  let L=C.sorted.filter(d=>(docFilter==='all'||(docFilter==='Key'&&d.tier==='Key')||(docFilter==='A'&&d.c==='A')||(docFilter==='unseen'&&d.seen===0))&&(!docQ||d.n.toLowerCase().includes(docQ.toLowerCase())));
  h+=`<div class="note">${L.length} دكتور</div>`+L.map(d=>`<div class="card"><div class="row" style="border:0;padding:0"><div class="l"><b style="text-align:right"><bdi>${esc(d.n)}</bdi> <span class="badge ${d.c}">${d.c}</span> <span class="pill ${d.tier==='Key'?'p-warn':d.tier==='Core'?'p-idle':'p-idle'}">${d.tier}</span></b><span class="meta">${d.h==='Nakheel'?'النخيل':'نمار'} · ${esc(d.s)} · زيارات ${d.seen}/${d.planned||0}${d.planned?'':' (لا زيارة مخططة)'}</span></div><div style="text-align:center"><b style="font-size:20px;color:var(--brand)">${d.total}</b><div class="meta">علبة</div></div></div><div class="chips">${askChips(d)}</div></div>`).join('');
  return h;}
function reportText(C){
  const S=status(C);const low=C.items.filter(x=>x.st==='low'),behind=C.items.filter(x=>x.st==='behind'),over=C.items.filter(x=>x.cover!=null&&x.cover>6);
  const unseenA=C.docs.filter(d=>d.c==='A'&&d.seen===0).length;
  const L=[];
  L.push(`الحالة: ${S.t} (${S.s})`);L.push('');
  L.push(`الخلاصة: هدف ${MONTHS.find(x=>x.k===curM).n} ${fmt(C.target)} علبة (≈${fmt(C.target/NDAYS)} يومياً). المسجّل ${fmt(C.actual)} علبة${C.proj!=null?'، والتوقع '+Math.round(C.proj*100)+'% من الهدف':''}.`);L.push('');
  L.push('التقدم:');
  L.push(`- زيارات الدكاترة: ${C.vTot?C.vDone+' من '+C.vTot:'لم تُرفع قائمة الشهر بعد'}`);
  L.push(`- أيام مسجّل فيها مبيعات: ${C.dData} من ${NDAYS}`);
  L.push('');L.push('المخاطر:');
  if(low.length)L.push(`- مخزون أقل من شهر: ${low.map(x=>x.place+' '+x.item+' ('+x.cover+' شهر)').join('، ')}`);
  if(behind.length)L.push(`- أصناف متأخرة عن الوتيرة: ${behind.map(x=>x.place+' '+x.item).join('، ')}`);
  if(unseenA)L.push(`- دكاترة Class A لم تتم زيارتهم: ${unseenA}`);
  if(over.length)L.push(`- مخزون كافٍ لأكثر من 6 أشهر (لا طلبات جديدة متوقعة): ${over.map(x=>x.place+' '+x.item).join('، ')}`);
  if(!low.length&&!behind.length&&!unseenA)L.push('- لا مخاطر بارزة');
  L.push('');L.push('المطلوب:');
  if(low.length)L.push(`- اعتماد توريد/متابعة طلب: ${low.map(x=>x.item+' '+x.place).join('، ')}`);
  L.push('- تأكيد توزيع فوركاست المستشفى بين النخيل ونمار');const A=annualCalc(C);L.push('');L.push('السنة (خط Zoron/Maxim/Meva):');L.push(`- مبيعات يناير–سبتمبر: ${fmt(A.lineYtd)} علبة · هدف الربع الرابع: ${fmt(A.lineQ4)} علبة · المتوقع للسنة: ${fmt(A.lineYear)} علبة`);L.push(`- كل المنتجات: ${fmt(A.allYtd)} وحدة حتى سبتمبر، ونمو ${(A.yoy*100).toFixed(0)}% عن 2025 (يناير–يوليو)`);
  L.push('');L.push('الخطوة القادمة:');
  L.push(VDAYS.length?`- زيارات ${VDAYS.map(d=>{const l=dayLabel(d);return l.n+' '+l.d}).join(' · ')}، وتحديث التسجيل آخر كل يوم`:'- تحديث التسجيل آخر كل يوم');
  return L.join('\n');}
function vRep(C){const S=status(C);const t=reportText(C);
  return monthChips()+`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>تقرير للمدير · ${MONTHS.find(x=>x.k===curM).n}</span><span class="pill p-${S.c}">${S.t}</span></div><div class="card rep" id="reptxt">${esc(t)}</div><button class="btn" id="copy">نسخ التقرير للواتساب</button><button class="btn" id="share" style="background:var(--brand2)">مشاركة نسخة للعرض (رابط)</button><div class="note">الرابط يحمل أرقامك الحالية، ومن يفتحه يشوفها بدون تعديل.</div>`;}
function render(){
  const C=calc();document.getElementById('sub').textContent=`اليوم ${dayLabel(TK).n} ${dayLabel(TK).d} · ${MONTHS.find(x=>x.k===curM).n}: ${C.dData} من ${NDAYS} أيام مسجّلة`;
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-t="${t[0]}"><span class="ic">${t[2]}</span>${t[1]}</button>`).join('');
  const app=document.getElementById('app');const keep=window.scrollY;
  const bn=readOnly?`<div class="card" style="background:var(--warnbg)">نسخة للعرض فقط · بيانات بتاريخ ${shareDate}<button class="btn" id="adopt" style="margin-top:8px">استخدم هذه البيانات عندي</button></div>`:'';app.innerHTML=bn+({today:vToday,log:vLog,dash:vDash,year:vYear,docs:vDocs,rep:vRep}[tab])(C);
  bind();window.scrollTo(0,keep);}

function bind(){
  document.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{setMonth(b.dataset.mon);render();});
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selDay=b.dataset.day;render();});
  document.querySelectorAll('[data-lday]').forEach(b=>b.onclick=()=>{logDay=b.dataset.lday;render();});
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(readOnly){toast('نسخة للعرض فقط');return;}const k=b.dataset.v;if(state.done[k])delete state.done[k];else state.done[k]=1;save();render();});
  const setV=(i,v)=>{if(readOnly){toast('نسخة للعرض فقط');return;}state.log[logDay]=state.log[logDay]||{};if(v===''||v==null||isNaN(v)||v<=0)delete state.log[logDay][i];else state.log[logDay][i]=Math.round(v*10)/10;save();};
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=b.dataset.p;setV(i,Number((state.log[logDay]||{})[i]||0)+1);render();});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=b.dataset.m;setV(i,Math.max(0,Number((state.log[logDay]||{})[i]||0)-1));render();});
  document.querySelectorAll('[data-in]').forEach(inp=>inp.onchange=()=>{setV(inp.dataset.in,inp.value===''?'':Number(inp.value));render();});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{docFilter=b.dataset.f;render();});
  const q=document.getElementById('q');if(q)q.oninput=()=>{docQ=q.value;const p=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p);};
  const ad=document.getElementById('adopt');if(ad)ad.onclick=()=>{readOnly=false;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}save();initDb();render();};
  const sh=document.getElementById('share');if(sh)sh.onclick=async()=>{const url=location.href.split('#')[0]+'#s='+encState();try{if(navigator.share){await navigator.share({title:'داشبورد دله',url:url});return;}}catch(e){}try{await navigator.clipboard.writeText(url);toast('تم نسخ الرابط ✓');}catch(e){prompt('انسخ الرابط',url);}};
  const cp=document.getElementById('copy');if(cp)cp.onclick=async()=>{const t=document.getElementById('reptxt').innerText;try{await navigator.clipboard.writeText(t);toast('تم النسخ ✓');}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById('reptxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('حدد النص وانسخه');}};
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render();window.scrollTo(0,0);}});
load();{const m=location.hash.match(/[#&]s=([^&]+)/);if(m){try{const r=decState(m[1]);state=r.st;readOnly=true;shareDate=r.t;}catch(e){}}}render();initDb();
</script>
</body>
</html>
