<title>Sales HQ · GIT 2 · 2026</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1b2d;--mute:#64748b;--line:#e4e9f1;--brand:#0f2a47;--brand2:#1d6fb8;--acc:#0ea5a4;--ok:#16a34a;--okbg:#e7f6ec;--warn:#d97706;--warnbg:#fff3df;--bad:#dc2626;--badbg:#fdeaea;--chip:#edf3fb;--idle:#eef1f6;--shadow:0 1px 2px rgba(15,27,45,.05),0 6px 20px rgba(15,27,45,.05);--r:16px}
:root[data-theme=dark]{--bg:#0b1220;--card:#131d2e;--ink:#e8eef7;--mute:#93a3ba;--line:#22304a;--brand:#9cc8f2;--brand2:#6fb0ee;--acc:#35d0cf;--ok:#4ade80;--okbg:#10301d;--warn:#fbbf24;--warnbg:#3a2c0f;--bad:#f87171;--badbg:#3b1717;--chip:#182843;--idle:#1b2740;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}

*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:block}
#side{display:none}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,#0b2240,#164f86);color:#fff;box-shadow:0 2px 12px rgba(5,20,45,.25)}
#top .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:18px;flex:0 0 auto}
#top .ttl{flex:1;min-width:0}#top .ttl b{display:block;font-size:15.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .ttl span{font-size:11.5px;opacity:.8}
.ibtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.ibtn:hover{background:rgba(255,255,255,.24)}
.hs{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 11px 5px 7px;background:rgba(255,255,255,.14);font-weight:700;font-size:13px;cursor:pointer;border:0;color:#fff}
.hs i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
.g-ok{background:var(--ok)}.g-warn{background:var(--warn)}.g-bad{background:var(--bad)}
#crumbs{padding:10px 16px 0;font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#crumbs a{color:var(--brand2);cursor:pointer;text-decoration:none}#crumbs a:hover{text-decoration:underline}
#view{padding:10px 14px calc(92px + env(safe-area-inset-bottom,0px));max-width:1280px;margin:0 auto}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#bnav button{flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:5px 2px;border-radius:10px}
#bnav button b{font-size:20px;line-height:1;font-weight:400}#bnav button.on{color:var(--brand2);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{font-size:15px;margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--mute);font-weight:700;margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--line)}
.pagehead{margin:6px 2px 14px}.pagehead h1{font-size:23px;letter-spacing:-.3px}.pagehead p{margin:4px 0 0;color:var(--mute);font-size:14px;max-width:760px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}.g4{grid-template-columns:1fr 1fr}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand2)}
.kpi.ok:before{background:var(--ok)}.kpi.warn:before{background:var(--warn)}.kpi.bad:before{background:var(--bad)}
.kpi b{display:block;font-size:22px;letter-spacing:-.5px;line-height:1.15}.kpi span{font-size:12px;color:var(--mute)}.kpi small{display:block;font-size:11.5px;margin-top:2px}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}.mt{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-idle{background:var(--idle);color:var(--mute)}.p-info{background:var(--chip);color:var(--brand2)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:7px;padding:1px 8px;background:var(--idle);color:var(--mute);margin:1px 3px 1px 0}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme=dark] .chip.on{color:#06101f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:600;font-size:14px}
:root[data-theme=dark] .btn{color:#06101f}
.btn.sec{background:var(--chip);color:var(--brand2)}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.block{display:flex;width:100%;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card)}
table.t td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal;min-width:120px}
table.t tr.row{cursor:pointer}table.t tr.row:hover td{background:var(--chip)}
table.t tr.hl td{background:var(--chip)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
div.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}div.row:last-child{border:0}
div.row .l{flex:1;min-width:0}div.row .l b{display:block;font-size:14.5px}div.row .l span{font-size:12.5px;color:var(--mute)}
.bar{height:7px;border-radius:9px;background:var(--idle);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand2),var(--acc))}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.ins{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}.ins:last-child{border:0}.ins>i{font-style:normal;font-size:18px;flex:0 0 26px;text-align:center}.ins b{font-weight:700}
input.tx,textarea.tx,select.tx,input.search{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--card);color:var(--ink);margin:3px 0 8px}
textarea.tx{min-height:64px;resize:vertical}
input.search{height:42px;margin-bottom:10px}
.lab{font-size:12px;color:var(--mute);font-weight:600;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--brand2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);transition:.15s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand2)}
.tile .bd{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--chip)}
.tile b{font-size:14.5px}.tile span{font-size:12.5px;color:var(--mute);line-height:1.35}
.tile .m{font-size:12px;font-weight:700;color:var(--brand2)}
.hero{display:grid;gap:16px;grid-template-columns:1fr;background:linear-gradient(135deg,#0b2240 0%,#164f86 100%);color:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(11,34,64,.28)}
.hero h2{font-size:21px;letter-spacing:-.4px;line-height:1.25}.hero p{margin:6px 0 0;opacity:.88;font-size:14px}
.hero .ringw{display:flex;gap:16px;align-items:center}
.ind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ind>div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px;font-size:12px}
.ind b{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.ind .bar{background:rgba(255,255,255,.18);margin-top:3px}.ind .bar i{background:#fff}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.tabs2{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:4px}
.tabs2 button{border:0;background:var(--idle);border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.tabs2 button.on{background:var(--brand);color:#fff}:root[data-theme=dark] .tabs2 button.on{color:#06101f}
.act{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.act:last-child{border:0}
.act .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--chip);color:var(--brand2);display:grid;place-items:center;font-weight:800;font-size:13px}
.act .b{flex:1;min-width:0}.act .b b{display:block}.act .b span{font-size:13px;color:var(--mute)}
.act .r{text-align:right;font-weight:800;white-space:nowrap}
.visit{display:flex;gap:12px;align-items:flex-start}
.tick{flex:0 0 42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:22px;color:transparent}
.visit.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}.visit.done .nm{color:var(--mute);text-decoration:line-through}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--idle);color:var(--mute)}.badge.A{background:var(--warnbg);color:var(--warn)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}#toast.on{opacity:.95}
#pal{position:fixed;inset:0;z-index:80;background:rgba(8,18,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:70px 14px}
#pal[hidden]{display:none}
#pal .box{width:100%;max-width:620px;background:var(--card);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
#pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font:inherit;font-size:16px;background:var(--card);color:var(--ink);outline:none}
#pal .res{max-height:55vh;overflow:auto}
#pal .it{display:flex;gap:12px;align-items:center;padding:11px 18px;cursor:pointer;border-bottom:1px solid var(--line)}
#pal .it.sel,#pal .it:hover{background:var(--chip)}#pal .it small{color:var(--mute);margin-left:auto;font-size:12px}
.qd{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--mute);margin-top:6px}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:14px;padding:22px;max-width:820px;margin:0 auto 12px;box-shadow:var(--shadow)}
.paper h2{font-size:20px;margin-bottom:2px;color:#0b2240}.paper h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#0b2240;border-bottom:2px solid #0b2240;padding-bottom:3px}
.paper table{width:100%;border-collapse:collapse;font-size:13px}.paper td,.paper th{padding:5px 6px;border-bottom:1px solid #e5e7eb;text-align:right}.paper td:first-child,.paper th:first-child{text-align:left}
.paper .k{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.paper .k div{flex:1;min-width:110px;border:1px solid #dbe3ee;border-radius:10px;padding:8px 10px}.paper .k b{display:block;font-size:18px}.paper .k span{font-size:11px;color:#667}
.paper li{margin:3px 0;font-size:13.5px}

}
.sb-brand{display:flex;gap:11px;align-items:center;padding:18px 18px 12px}.sb-brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#0b2240,#1d6fb8);display:grid;place-items:center;color:#fff;font-size:19px}
.sb-brand b{display:block;font-size:15px}.sb-brand span{font-size:11.5px;color:var(--mute)}
.sb-search{margin:4px 14px 8px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px 11px;color:var(--mute);font-size:13.5px;background:var(--bg);cursor:pointer}.sb-search kbd{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px}
.sb-g{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);font-weight:700;padding:14px 20px 5px}
.sb-i{display:flex;align-items:center;gap:11px;width:calc(100% - 16px);margin:1px 8px;padding:8px 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:14px}
.sb-i:hover{background:var(--chip)}.sb-i.on{background:var(--brand);color:#fff;font-weight:600}:root[data-theme=dark] .sb-i.on{color:#06101f}
.sb-i .ic{font-size:17px;width:22px;text-align:center}
.sb-ft{margin-top:auto;padding:12px 18px;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line)}
@media print{#side,#bnav,#top,#crumbs,.noprint,#toast{display:none!important}body{background:#fff}#view{padding:0;max-width:none}.paper{box-shadow:none;border:0;margin:0}.card{box-shadow:none}#app{display:block}}

@media (max-width:699px){#top .ttl span{display:none}#top .ttl b{font-size:15px}.hs{padding:4px 9px 4px 5px;font-size:12.5px}#top{gap:8px;padding:9px 12px}}

#main{min-width:0}#view{min-width:0}.card,.kpi,.grid>*{min-width:0}

.paper{overflow-x:auto}.paper table{display:block;overflow-x:auto;white-space:nowrap}

table.t th{position:static}.stickybar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:12;background:var(--card);border:2px solid var(--brand2);border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(15,27,45,.12)}.sb2{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.sb2 b{font-size:22px;display:block;line-height:1.1}.sb2 span{font-size:12px;color:var(--mute)}

table.t td.tl,table.t th.tl{text-align:left}

</style>
</head>

  if(zd.length)H.push({id:'zd',sev:'Medium',t:'Forecast priced at list (0% discount)',n:zd.length,det:zd.map(c=>c.n.trim().slice(0,28)).join(' · '),fix:'Check whether the net price in the forecast file is complete.'});
  const nof=m.P.filter(p=>p.fb>0&&p.fc===0);
  if(nof.length)H.push({id:'nof',sev:'Medium',t:'Products with a target but no Q4 forecast',n:nof.length,det:nof.map(p=>p.name).join(' · '),fix:'Add forecast or acknowledge a gap.'});
  const nob=m.P.filter(p=>p.fb===0&&p.fc>0);
  if(nob.length)H.push({id:'nob',sev:'Low',t:'Forecast products without a budget',n:nob.length,det:nob.map(p=>p.name).join(' · '),fix:'Add budget line or reclassify.'});
  const hneg=HP.filter(p=>p.si<p.so&&p.so-p.si>1000);
  if(hneg.length)H.push({id:'hneg',sev:'Medium',t:'Habib: consumption above sell-in (possible other channel)',n:hneg.length,det:hneg.map(p=>PN(p.name)+' ('+Mn(p.so-p.si)+')').join(' · '),fix:'Confirm whether Habib sources these products elsewhere.'});
  const lowc=m.day.items.filter(x=>x.st==='low');
  if(lowc.length)H.push({id:'low',sev:'High',t:'Dallah items below 1 month of cover',n:lowc.length,det:lowc.map(x=>x.place+' '+x.item+' ('+x.cover+' mo)').join(' · '),fix:'Raise supply alert; stock date is 14 Oct.'});
  const unm=HP.filter(p=>!(p.d26&&p.d26.length)&&sum(p.um26)>0);
  H.push({id:'map',sev:'Low',t:'Product-name matching between Habib and Dallah files is approximate',n:unm.length,det:unm.slice(0,8).map(p=>PN(p.name)).join(' · '),fix:'Maintain a code mapping table.'});
  const un=m.docs.filter(d=>d.c==='A'&&d.act===0);
  if(un.length)H.push({id:'unv',sev:'Medium',t:'Class A doctors with no HQ visit',n:un.length,det:un.slice(0,10).map(d=>d.n+' ('+d.s+')').join(' · '),fix:'Schedule in this week\'s plan.'});
  H.push({id:'age',sev:'Low',t:'Data freshness',n:1,det:'Sales through Sep 2026 (final) · Habib and branches through Sep · Jamjoom stock 4 Oct · Dallah stock 14 Oct · HQ tracker 4 Oct',fix:'All sources now cover September. Refresh Dallah stock with the next consumption reports.'});
  H.push({id:'obj',sev:'Medium',t:'Habib objective definition is not stated in the file',n:1,det:'Objective 1,591,000 vs forecast '+Mn(m.hAll.fv)+' and overstock '+Mn(m.hAll.gap),fix:'Confirm whether it is sell-in required or net of overstock.'});
  {const SC=stockCheck(),sh=SC.filter(x=>x.st==='short'||x.st==='nofile');if(sh.length)H.push({id:'stk',sev:'Medium',t:'Warehouse stock below one month of the Q4 forecast (scope to confirm)',n:sh.length,det:sh.map(x=>PN(x.name)+(x.cov!=null?' ('+x.cov.toFixed(1)+' mo)':' (not in stock file)')).join(' · '),fix:'Confirm with supply chain what the 4 Oct stock file covers and the planned supply for Q4.'});}
  {const C=brCalc(m);if(C.recon.length)H.push({id:'brx',sev:'Low',t:'Branch file differs from the Habib dashboard by more than 5% for some drugs',n:C.recon.length,det:C.recon.slice(0,6).map(r=>PN(r.n)+' '+(r.d>0?'+':'')+fmt(r.d)).join(' · '),fix:'Ask Habib which file is final; the dashboard total is used for sell-out value.'});if(C.noBr.length)H.push({id:'nobr',sev:'Low',t:'Habib doctors with no branch sales data',n:C.noBr.length,det:'Al Nakhil: '+C.noBr.length+' doctors in the HQ tracker, branch sales file has no Al Nakhil',fix:'Request Al Nakhil sales-out from Habib.'});}
  const sc=H.reduce((s,h)=>s+(h.sev==='High'?3:h.sev==='Medium'?2:1)*Math.min(h.n,3),0);
  return {list:H,score:clamp(100-sc*2.2,0,100)};}

function forecastText(m){
  const T=m.T,L=[];
  L.push(`FORECAST UPDATE — GIT 2 (Zoron · Maxim · Meva) — ${dayLabel(TODAY).long}`);L.push('');
  L.push(`Position: ${ragWord[m.health.st]} (health ${Math.round(m.health.score)}/100). YTD ${Mn(T.ytd26)} = ${p0(T.ach)} of YTD target, ${pS(T.yoy)} vs 2025. Annual target ${Mn(T.bgFY)}; gap ${Mn(T.gap)}.`);L.push('');
  L.push(`Q4 forecast: ${bx(m.alloc.totalBoxes)} boxes = SAR ${Mn(T.fcQ4)} (${(T.fcQ4/T.bgQ4).toFixed(1)}× Q4 budget, ${T.uplift?T.uplift.toFixed(1):'—'}× Q4 2025). ${S.fclog.length?'Edited from '+bx(m.alloc.origBoxes)+' boxes ('+S.fclog.length+' changes).':''}`);
  L.push(`- Boxes: Commit ${bx(m.bkB.commit)} · Best case ${bx(m.bkB.best)} · Stretch ${bx(m.bkB.stretch)} · No history ${bx(m.bkB.new)}`);
  L.push(`- Risk-weighted: ${Mn(m.weighted)} → year closes at ${p0(m.wo)} of target. Full forecast: ${p0((T.ytd26+T.fcQ4)/T.bgFY)}. At ${S.set.real}% realization: ${p0(m.o)}.`);L.push('');
  L.push('What is closing (Commit/Best case, top accounts):');m.acc.filter(c=>c.bk==='commit'||c.bk==='best').sort((a,b)=>b.fc-a.fc).slice(0,5).forEach(c=>L.push(`- ${c.n.trim()}: ${bx(c.fbT)} boxes (SAR ${Mn(c.fc)}; Q4-25 SAR ${Mn(c.q425)})`));L.push('');
  L.push('At risk (needs confirmed orders):');m.acc.filter(c=>c.bk==='stretch'||c.bk==='new').sort((a,b)=>b.fc-a.fc).slice(0,5).forEach(c=>L.push(`- ${c.n.trim()}: ${bx(c.fbT)} boxes (SAR ${Mn(c.fc)}) — ${c.q425>0?(c.fc/c.q425).toFixed(1)+'× its Q4-25':'no prior sales'}`));L.push('');

  L.push('Asks:');m.actions.filter(a=>a.type!=='coverage').slice(0,3).forEach(a=>L.push(`- ${a.title}`));
  return L.join('\n');}

ROUTES.ideas=function(){

  const selG=L.filter(l=>l.type==='grow'&&l.sel),selP=L.filter(l=>l.type==='protect'&&l.sel);

  <div class="card"><h3>How to read the levers</h3><div class="ins"><i>🛡️</i><div><b>Protect</b> — forecast you already count on but that could fall away (unproven account, overstock, stock-out). Value = amount × downside risk (at least 30%) × probability you secure it.</div></div><div class="ins"><i>🚀</i><div><b>Grow</b> — upside above the forecast (account target not yet covered, weak products). Counted at its probability.</div></div><div class="ins"><i>⚖️</i><div>Expected value = amount × probability. Probabilities are starting assumptions — change them as you learn.</div></div></div></div>`;
  const row=l=>`<div class="act"><button class="tick ${l.sel?'':''}" data-do="lev" data-id="${esc(l.id)}" style="flex:0 0 36px;height:36px;border-radius:10px;${l.sel?'background:var(--ok);border-color:var(--ok);color:#fff':''}">${l.sel?'✓':''}</button><div class="b"><b>${esc(l.title)}</b><span>${esc(l.how)}</span><div style="margin-top:4px"><span class="tag">Effort ${l.effort}</span><span class="tag">${esc(l.owner)}</span><span class="tag">P ${p0(l.prob)}</span>${l.acc?`<a data-go="account/${l.acc}" style="color:var(--brand2);cursor:pointer;font-size:12.5px">Open account →</a>`:''}</div></div><div class="r">${Mn(l.amt)}<div class="mt" style="font-size:11px;font-weight:500">EV ${Mn(l.ev)}</div></div></div>`;
  H+=`<div class="eyebrow">Protect — secure what is already in the forecast</div><div class="card">${L.filter(l=>l.type==='protect').map(row).join('')||'Nothing to protect.'}</div>`;
  H+=`<div class="eyebrow">Grow — add volume above the forecast</div><div class="card">${L.filter(l=>l.type==='grow').map(row).join('')||'No growth levers computed.'}</div>`;

   ['Where can one visit unlock volume?','Look at Tier 1 accounts with high forecast and low coverage (Stakeholders → Priority list).'],

      else{const dc=D2.docs.find(x=>x.h+'|'+x.n===v.k);if(!dc)return '';nm=dc.n;cl=dc.c;meta=`Dallah · ${dc.h} · ${dc.s}`;}

const LINESX=[{k:'Zoron',re:/Zoron/i,mol:'Ondansetron (antiemetic)',ref:'Zofran (originator) + local generics',use:'ER · surgery · obstetrics · internal medicine'},{k:'Maxim',re:/Maxim/i,mol:'Moxifloxacin (antibiotic)',ref:'Avelox (Bayer) + generics',use:'ENT · chest · internal medicine'},{k:'Meva',re:/Meva/i,mol:'Mebeverine (IBS)',ref:'Duspatalin + generics',use:'GI · internal medicine · family medicine'}];
ROUTES.compete=function(){
  const m=M();let H=pageHead('Competitive','Where each line stands, where it is losing, and a place to log what you hear in the field.');
  H+=`<div class="card flat" style="background:var(--warnbg)"><b>Note:</b> your files contain no market-share data. Competitor names below are general references; add field evidence in the note boxes, or send an IQVIA/market report and I will build share and price-index views.</div>`;
  LINESX.forEach(L=>{
    const P=m.P.filter(p=>L.re.test(p.name));const y=sum(P.map(p=>p.y)),y25=sum(P.map(p=>p.y25)),yt=sum(P.map(p=>p.yt)),fc=sum(P.map(p=>p.fc));
    const pr=Object.entries(SALES.price).filter(x=>L.re.test(PN(x[0])));
    const weak=P.filter(p=>p.y25>0).map(p=>({p,y:ypc(p.y,p.y25)})).sort((a,b)=>a.y-b.y);
    H+=`<div class="eyebrow">${L.k} · ${L.mol}</div><div class="card"><div class="grid g4">${kpi(Mn(y),'YTD 2026')}${kpi(pS(ypc(y,y25)),'vs '+Mn(y25),ypc(y,y25)>=0?'ok':'bad')}${kpi(p0(ach(y,yt)),'of YTD target')}${kpi(Mn(fc),'Q4 forecast')}</div>`;
    H+=`<div class="scroll"><table class="t"><tr><th>Product</th><th>YTD</th><th>YoY</th><th>% target</th><th>List price</th><th>Net price</th><th>Discount</th></tr>`+P.map(p=>{const pp=SALES.price[Object.keys(SALES.price).find(k=>PN(k)===p.name)]||null;return `<tr><td>${esc(p.name)}</td><td>${Mn(p.y)}</td><td class="${cls(ypc(p.y,p.y25))}">${pS(ypc(p.y,p.y25))}</td><td>${p0(ach(p.y,p.yt))}</td><td>${pp?pp.list:'—'}</td><td>${pp?pp.net_w:'—'}</td><td>${pp?p0(1-pp.net_w/pp.list):'—'}</td></tr>`;}).join('')+'</table></div>';
    const b=[];if(weak.length&&weak[0].y<-.2)b.push(`⚠️ Loss signal: ${weak[0].p.name} ${pS(weak[0].y)} — is it price, stock or a competitor?`);if(weak.length&&weak[weak.length-1].y>.2)b.push(`✅ Strength: ${weak[weak.length-1].p.name} ${pS(weak[weak.length-1].y)} — invest here.`);b.push(`Reference competitor: ${L.ref} (general reference — verify in the field). Typical prescribers: ${L.use}.`);
    H+=b.map(x=>`<div class="ins"><i>•</i><div>${x}</div></div>`).join('')+noteBox('comp:'+L.k,'Field notes: competitor, reason, doctor response','What are doctors and pharmacies telling you?')+'</div>';});
  H+=`<div class="eyebrow">Accounts losing the most</div><div class="card">${m.acc.filter(c=>c.y25>0).map(c=>({c,d:c.y26-c.y25})).sort((a,b)=>a.d-b.d).slice(0,6).map(x=>`<div class="row" data-go="account/${x.c.id}" style="cursor:pointer"><div class="l"><b>${acctName(x.c)}</b><span>${Mn(x.c.y26)} vs ${Mn(x.c.y25)}</span></div><b class="dn">${Mn(x.d)}</b></div>`).join('')}</div>`;
  return H;};

UI.fx={acc:'all',prod:'all',q:'',zero:false};
UI.dfc={g:'all',q:''};
const accNameById=id=>String((ACCI[id]||{n:id}).n).trim();
function fxLogPush(k,i,a,b,kind){S.fclog.unshift({t:new Date().toISOString(),k,m:i,a,b,kind:kind||'edit'});if(S.fclog.length>400)S.fclog.length=400;}
function fxSet(key,i,val){const r=FX.rows.find(x=>fxKey(x)===key);if(!r)return;const cur=fxEff(r);const nv=Math.max(0,Math.round(Number(val)||0));if(cur[i]===nv)return;const e=cur.slice();e[i]=nv;fxLogPush(key,i,cur[i],nv);const o=r.o.map(Math.round);if(e.every((x,k)=>x===o[k]))delete S.fc[key];else S.fc[key]=e;save();}
function fxScaleRows(rows,f,label){rows.forEach(r=>{const cur=fxEff(r);const e=cur.map(x=>Math.round(x*f));if(e.some((x,k)=>x!==cur[k])){fxLogPush(fxKey(r),-1,sum(cur),sum(e),label||'scale');const o=r.o.map(Math.round);if(e.every((x,k)=>x===o[k]))delete S.fc[fxKey(r)];else S.fc[fxKey(r)]=e;}});save();}
const fxTime=t=>{const d=new Date(t);return d.getDate()+' '+MS[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes());};

  <h4>By account</h4><table><tr><th>Account</th><th>Oct</th><th>Nov</th><th>Dec</th><th>Q4</th><th>Original</th><th>SAR</th></tr>${byAcc.map(c=>`<tr><td>${esc(c.n.trim())}</td><td>${bx(c.fb[0])}</td><td>${bx(c.fb[1])}</td><td>${bx(c.fb[2])}</td><td><b>${bx(c.fbT)}</b></td><td>${bx(c.fb0)}</td><td>${Mn(c.fc)}</td></tr>`).join('')}</table>

function boardPlace(id,m){
  const p=m.alloc.places.find(x=>x.acc===id);const c=ACCI[id];
  if(!p||!c)return pageHead('Place not found','')+`<div class="card"><button class="btn" data-go="board">Back</button></div>`;
  const rowsAll=FX.rows.filter(r=>r.a===id&&(r.tot>0||r.o0>0)).sort((a,b)=>b.tot-a.tot);
  let H=pageHead(esc(p.name),p.direct?`Hospital forecast shared directly by ${p.docs.length} doctors`:'Pharmacy / warehouse forecast — split indirectly across all territory doctors',`<span class="noprint"><button class="btn sec" data-go="board">‹ All places</button> <button class="btn sec" data-go="account/${id}">Account page</button></span>`);
  const tb=sum(rowsAll.map(r=>r.tot)),ob=sum(rowsAll.map(r=>r.o0));
  H+=`<div class="grid g4" style="margin-bottom:12px">${kpi(bx(tb),'Q4 boxes (this place)',tb>=ob?'ok':'warn',`SAR ${Mn(sum(rowsAll.map(r=>r.tot*r.price)))}`)}${kpi(bx(ob),'As in your sheet')}${kpi(['Oct','Nov','Dec'].map((x,i)=>x+' '+bx(sum(rowsAll.map(r=>r.e[i])))).join(' · '),'By month','')}${kpi(String(p.direct?p.docs.length:m.docs.length),p.direct?'Doctors sharing':'Doctors in the pool')}</div>`;
  // place numbers
  H+=`<div class="eyebrow">1 · Forecast for this place (edit — same rows as your sheet)</div><div class="card scroll"><table class="t"><tr><th>Product</th><th>Price</th><th>Oct</th><th>Nov</th><th>Dec</th><th>Q4</th><th>Sheet</th><th>Change</th></tr>`+rowsAll.map(r=>`<tr><td>${esc(r.pn)}</td><td>${(+r.price).toFixed(2)}</td>`+[0,1,2].map(i=>`<td><input class="tx" style="width:84px;margin:0;text-align:right;${r.e[i]!==Math.round(r.o[i])?'border-color:var(--warn);background:var(--warnbg)':''}" type="number" inputmode="numeric" min="0" step="1" data-fxk="${esc(fxKey(r))}" data-fxi="${i}" value="${r.e[i]}" ${READONLY?'disabled':''}></td>`).join('')+`<td><b>${bx(r.tot)}</b></td><td class="mt">${bx(r.o0)}</td><td class="${r.tot>r.o0?'up':r.tot<r.o0?'dn':''}">${r.tot===r.o0?'—':(r.tot>r.o0?'+':'')+bx(r.tot-r.o0)}</td></tr>`).join('')+`<tr class="hl"><td colspan="2"><b>Total</b></td>${[0,1,2].map(i=>`<td><b>${bx(sum(rowsAll.map(r=>r.e[i])))}</b></td>`).join('')}<td><b>${bx(tb)}</b></td><td>${bx(ob)}</td><td></td></tr></table></div>`;

function brCalc(m){
  const hbp={};HP.forEach(p=>{hbp[p.code]=p;});
  const A=BRI.map((b,i)=>{
    const mo26=Array.from({length:9},(_,k)=>sum(BR.prods.map(p=>p.v[i][9+k])));
    const mo25=Array.from({length:9},(_,k)=>sum(BR.prods.map(p=>p.v[i][k])));
    const y26=sum(mo26),y25=sum(mo25);
    const top=BR.prods.map(p=>({n:p.n,code:p.code,u:brU(p,i).y26,u5:brU(p,i).y25})).sort((x,y)=>y.u-x.u);
    const docs=m.docs.filter(d=>d.o==='Habib'&&d.s===BRSITE[b.id]);
    const goal=sum(docs.map(d=>d.goal)),act=sum(docs.map(d=>d.act));
    const Acl=docs.filter(d=>d.c==='A');
    const val26=sum(BR.prods.map(p=>{const h=hbp[p.code];return h?brU(p,i).y26*h.price:0;}));
    return {...b,i,mo26,mo25,y26,y25,yoy:ypc(y26,y25),top,docs:docs.length,goal,act,A:Acl.length,As:Acl.filter(d=>d.act>0).length,boxes:sum(docs.map(d=>d.fcT)),val26,last3:sum(mo26.slice(6,9)),prev3:sum(mo26.slice(3,6))};});
  const tot26=sum(A.map(a=>a.y26)),tot25=sum(A.map(a=>a.y25));
  const recon=BR.prods.map(p=>{const h=hbp[p.code];const bs=sum(BRI.map((b,i)=>brU(p,i).y26));const hs=h?sum(h.um26):0;return {n:p.n,code:p.code,bs,hs,d:bs-hs,rel:hs>0?(bs-hs)/hs:(bs>0?1:0)};}).filter(x=>Math.abs(x.d)>20&&Math.abs(x.rel)>.05).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  const noBr=m.docs.filter(d=>d.o==='Habib'&&!Object.values(BRSITE).includes(d.s));
  return {A,tot26,tot25,recon,noBr,hbp,hTot:sum(HP.map(p=>sum(p.um26)))};}
